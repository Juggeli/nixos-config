<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e2e" />
    <title>Portion Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,600&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand" aria-hidden="true">
        <!-- kitchen scale -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="12" width="14" height="8" rx="2" />
          <path d="M9.5 16h5" />
          <path d="M7 12c0-3.6 2.2-6.5 5-6.5s5 2.9 5 6.5" />
        </svg>
      </span>
      <h1>Portion <em>Calculator</em></h1>
    </header>

    <main id="view"></main>

    <nav class="bottomnav">
      <button data-view="calculator" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="12" width="14" height="8" rx="2" />
          <path d="M9.5 16h5" />
          <path d="M7 12c0-3.6 2.2-6.5 5-6.5s5 2.9 5 6.5" />
        </svg>
        Calculator
      </button>
      <button data-view="vessels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z" />
          <path d="M2 9h20" />
          <path d="M9 5.5C9 4.5 9.7 3.5 11 3.5M15 5.5c0-1-.7-2-2-2" />
        </svg>
        Vessels
      </button>
      <button data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3.2 2" />
        </svg>
        History
      </button>
    </nav>

    <script src="/app.js"></script>
  </body>
</html>
